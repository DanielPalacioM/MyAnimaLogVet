<div class="panel">
  <aside class="sidebar">
    <a class="brand" routerLink="/admin" aria-label="MyAnimaLogVet, ir a verificaciones">
      <span class="brand-text">MyAnimaLog&nbsp;&nbsp;&nbsp;<span class="brand-et">et</span></span>
      <img src="/brand/estetoscopio.png" alt="" />
    </a>

    <nav aria-label="Administración">
      @for (item of items; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" [attr.aria-label]="item.label">
          <vet-icon [name]="item.icon" [size]="18" />
          <span>{{ item.label }}</span>
          @if (item.badge && state.pendingClinics() > 0) {
            <span class="badge" [attr.aria-label]="state.pendingClinics() + ' clínicas por revisar'">{{ state.pendingClinics() }}</span>
          }
        </a>
      }
    </nav>

    <button type="button" class="user" [matMenuTriggerFor]="userMenu" aria-label="Menú de la cuenta">
      <span class="avatar">ML</span>
      <span class="who">
        <strong>Equipo MyAnimaLog</strong>
        <small><vet-icon name="shield" [size]="13" />Admin de plataforma</small>
      </span>
    </button>
    <mat-menu #userMenu="matMenu" xPosition="after">
      <button mat-menu-item (click)="signOut()">
        <mat-icon fontSet="material-icons-outlined">logout</mat-icon>
        Cerrar sesión
      </button>
    </mat-menu>
  </aside>

  <main class="main" id="contenido">
    <div class="main-inner">
      <router-outlet />
    </div>
  </main>
</div>
